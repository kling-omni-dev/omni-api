[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-api"
version = "0.1.0"
description = "Python client for the Kling Omni API: reference-driven image generation up to 4K through a hosted endpoint"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "kling-omni-dev"}]
keywords = ["ai api", "kling-image-o3", "omni", "omni api", "omni python", "synexa"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/kling-omni-dev/omni-api"
Documentation = "https://kling-omni-dev.github.io/omni-api/"
"Hosted model" = "https://synexa.ai/explore/kling/kling-image-o3?utm_source=github&utm_medium=ugc&utm_campaign=kling-omni-dev&utm_content=pyproject&utm_term=tier-a"

[tool.setuptools.packages.find]
include = ["omni_api*"]
